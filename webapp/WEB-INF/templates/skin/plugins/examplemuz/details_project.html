<@row>
    <@columns>
        <div class="mb-3">
            <a href="jsp/site/Portal.jsp?page=project" class="btn btn-outline-secondary btn-sm">
                &#8592; #i18n{examplemuz.details_project.backToList}
            </a>
        </div>

        <div>
            <img src="${project.imageUrl}" alt="${project.name}" style="object-fit: cover; max-height: 300px;">
            <div class="card-body">
                <h3 class="card-title">${project.name}</h3>
                <p class="card-text">${project.description}</p>
                <p class="text-muted small">#i18n{examplemuz.details_project.labelId} : ${project.id}</p>
            </div>
        </div>
    </@columns>
</@row>
